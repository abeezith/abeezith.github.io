name: Sync Latest Connectivity Outputs to Google Sheets

on:
  push:
    branches:
      - master
      - main
    paths:
      - "outputs/village_provider_signal_estimate.csv"
      - "outputs/village_connectivity_summary.xlsx"
      - "config.yaml"
      - "connectivity_pipeline/**"
      - "sync_google_sheets_from_outputs.py"
      - ".github/workflows/google-sheets-sync.yml"
  workflow_dispatch:
    inputs:
      provider_csv:
        description: Path to the latest provider CSV output
        required: false
        default: outputs/village_provider_signal_estimate.csv

permissions:
  contents: read

concurrency:
  group: google-sheets-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sync dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml gspread gspread-dataframe google-auth

      - name: Resolve provider CSV path
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.provider_csv }}" ]; then
            echo "PROVIDER_CSV=${{ github.event.inputs.provider_csv }}" >> "$GITHUB_ENV"
          else
            echo "PROVIDER_CSV=outputs/village_provider_signal_estimate.csv" >> "$GITHUB_ENV"
          fi

      - name: Preflight Google Sheets inputs
        shell: bash
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_FILE }}
        run: |
          python - <<'PY'
          import os
          import sys

          spreadsheet_id = os.getenv("GOOGLE_SHEETS_SPREADSHEET_ID", "").strip()
          service_account_json = os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON", "").strip()
          service_account_file = os.getenv("GOOGLE_SERVICE_ACCOUNT_FILE", "").strip()

          if not spreadsheet_id:
              print("Missing GOOGLE_SHEETS_SPREADSHEET_ID secret or config value.")
              sys.exit(1)
          if not (service_account_json or service_account_file):
              print("Missing Google service account secret. Add GOOGLE_SERVICE_ACCOUNT_JSON or GOOGLE_SERVICE_ACCOUNT_FILE.")
              sys.exit(1)

          print("Google Sheets preflight passed.")
          print(f"Spreadsheet ID present: yes")
          print(f"Service account JSON present: {'yes' if service_account_json else 'no'}")
          print(f"Service account file present: {'yes' if service_account_file else 'no'}")
          PY

      - name: Sync outputs to Google Sheets
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEETS_WORKSHEET_PREFIX: ${{ secrets.GOOGLE_SHEETS_WORKSHEET_PREFIX }}
        run: |
          python sync_google_sheets_from_outputs.py --config config.yaml --provider-csv "$PROVIDER_CSV"
