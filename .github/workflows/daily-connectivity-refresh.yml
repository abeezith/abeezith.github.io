name: Rolling Connectivity Refresh

on:
  schedule:
    # 21:30 UTC = 03:00 India Standard Time. One district each day stays
    # within OpenCellID's 1,000 daily request-credit allowance.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      requested_state:
        description: "Optional state to refresh instead of the daily rotation"
        required: false
        type: string
      requested_district:
        description: "Optional district to refresh instead of the daily rotation"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weekly-connectivity-refresh
  cancel-in-progress: true

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Preflight credentials and storage
        shell: bash
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_FILE }}
          OPENCELLID_TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os
          import sys

          spreadsheet_id = os.getenv("GOOGLE_SHEETS_SPREADSHEET_ID", "").strip()
          service_account_json = os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON", "").strip()
          service_account_file = os.getenv("GOOGLE_SERVICE_ACCOUNT_FILE", "").strip()

          if not spreadsheet_id:
              print("Missing GOOGLE_SHEETS_SPREADSHEET_ID secret or config value.")
              sys.exit(1)
          if not (service_account_json or service_account_file):
              print("Missing Google service account secret. Add GOOGLE_SERVICE_ACCOUNT_JSON or GOOGLE_SERVICE_ACCOUNT_FILE.")
              sys.exit(1)
          if not os.getenv("OPENCELLID_TOKEN", "").strip():
              print("Missing OPENCELLID_TOKEN secret.")
              sys.exit(1)
          if not os.getenv("GOOGLE_DRIVE_FOLDER_ID", "").strip():
              print("Missing GOOGLE_DRIVE_FOLDER_ID repository variable.")
              sys.exit(1)

          print("Credentials and Drive storage preflight passed.")
          PY

      - name: Download pipeline inputs and retained snapshots
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_FILE }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python drive_assets.py download-inputs --folder-id "$GOOGLE_DRIVE_FOLDER_ID" --destination runtime_inputs
          python drive_assets.py download-retention --folder-id "$GOOGLE_DRIVE_FOLDER_ID" --destination outputs/retention

      - name: Select today's district refresh target
        id: target
        env:
          REQUESTED_STATE: ${{ inputs.requested_state }}
          REQUESTED_DISTRICT: ${{ inputs.requested_district }}
        run: |
          if [ -n "$REQUESTED_STATE" ] || [ -n "$REQUESTED_DISTRICT" ]; then
            if [ -z "$REQUESTED_STATE" ] || [ -z "$REQUESTED_DISTRICT" ]; then
              echo "Provide both requested_state and requested_district, or leave both blank for the daily rotation."
              exit 1
            fi
            echo "state=$REQUESTED_STATE" >> "$GITHUB_OUTPUT"
            echo "district=$REQUESTED_DISTRICT" >> "$GITHUB_OUTPUT"
            echo "Selected manual target: $REQUESTED_STATE / $REQUESTED_DISTRICT"
          else
            python select_refresh_target.py \
              --requested-districts-csv runtime_inputs/phi_requested_districts.csv \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Refresh all requested districts from current sources
        env:
          OPENCELLID_TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
        run: |
          python enrich_requested_districts_from_stoptb.py \
            --source-csv runtime_inputs/stoptb_ben_screen_30_Jun_2026_mapped.csv \
            --requested-districts-csv runtime_inputs/phi_requested_districts.csv \
            --ookla-parquet runtime_inputs/ookla_mobile_tiles_q1_2026 \
            --requested-state "${{ steps.target.outputs.state }}" \
            --requested-district "${{ steps.target.outputs.district }}" \
            --force-refresh

      - name: Combine current district provider estimates
        run: |
          python collect_requested_provider_rows.py

      - name: Apply retention policy
        run: |
          python retention_policy.py --config config.yaml --provider-csv outputs/requested_district_provider_rows.csv.gz

      - name: Upload retained snapshots
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_FILE }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python drive_assets.py upload-retention --folder-id "$GOOGLE_DRIVE_FOLDER_ID" --source outputs/retention

      - name: Sync latest estimates to Google Sheets
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEETS_WORKSHEET_PREFIX: ${{ secrets.GOOGLE_SHEETS_WORKSHEET_PREFIX }}
        run: |
          python sync_google_sheets_from_outputs.py --config config.yaml --provider-csv outputs/requested_district_provider_rows.csv.gz

      - name: Rebuild requested district summary
        run: |
          python rebuild_requested_district_summary.py

      - name: Rebuild requested district site
        run: |
          python generate_requested_districts_site.py

      - name: Build public strength history
        run: |
          python generate_connectivity_history.py

      - name: Publish site to docs
        shell: bash
        run: |
          mkdir -p docs/networkmap
          cp outputs/requested_districts_site/index.html docs/networkmap/index.html
          cp outputs/requested_districts_site/history.html docs/networkmap/history.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
